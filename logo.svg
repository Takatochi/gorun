<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gorunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="120" height="120" rx="26" fill="#0d1321" stroke="url(#gorunGrad)" stroke-width="3"/>
  <!-- M:N parallel green fiber arcs forming a stylized G -->
  <path d="M 78 34 A 30 30 0 1 0 90 60 L 62 60" fill="none" stroke="url(#gorunGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M 70 44 A 18 18 0 1 0 76 60" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
  <!-- C++ '++' accents -->
  <path d="M 86 30 L 86 42 M 80 36 L 92 36" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
  <path d="M 100 30 L 100 42 M 94 36 L 106 36" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
</svg>
